name: TensorRT GPU Build (Manual)

on:
  workflow_dispatch:
    inputs:
      onnx_path:
        description: 'Path to ONNX model file'
        required: false
        default: 'runs/detect/train/weights/best.onnx'

jobs:
  build-trt:
    name: Build TensorRT engine (self-hosted GPU)
    runs-on: [self-hosted, gpu]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install tensorrt
      - name: Build TensorRT engine
        run: |
          python build_trt_engine.py || ./scripts/build_trt_docker.sh nvcr.io/nvidia/tensorrt:23.09-py3 ${{ github.event.inputs.onnx_path }} model.engine
        shell: bash
      - name: Upload engine artifact
        uses: actions/upload-artifact@v4
        with:
          name: tensorrt-engine
          path: model.engine
          retention-days: 7
