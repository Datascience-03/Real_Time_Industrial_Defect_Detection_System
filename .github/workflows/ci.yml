name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Syntax check (compileall)
        run: python -m compileall .

      - name: Run CI smoke script
        run: python ci_smoke.py || true

      - name: List top-level files
        run: ls -la
